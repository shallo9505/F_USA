<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="해외 주식 매수, 그룹별 비중, 배당금과 이자, 환전을 정리하는 개인 기록장">
<title>해외자산 노트</title>
<style>
:root { color-scheme: light dark; }

body { margin: 0 auto; max-width: 1168px; padding: 24px; }
.cursor-interaction { cursor: pointer; }

@media (max-width: 430px) { body { padding: 6px; } }
</style>
</head>
<body>
<noscript>기록장을 사용하려면 브라우저의 JavaScript를 켜 주세요.</noscript>
<div id="overseas-ledger-v2" lang="ko"></div>
<style>
#overseas-ledger-v2{--ol-bg:light-dark(#f5f7fa,#14191f);--ol-panel:light-dark(#ffffff,#1d242d);--ol-text:light-dark(#16283d,#e8eef6);--ol-sub:light-dark(#5c6d80,#aebdce);--ol-line:light-dark(#e3e8ef,#35404d);--ol-soft:light-dark(#eef3f8,#26313d);--ol-accent:light-dark(#164e63,#98d4e8);--ol-on:light-dark(#ffffff,#123341);--ol-tint:light-dark(#eaf4f6,#223c46);--ol-danger:light-dark(#a53132,#ffaaaa);--ol-warn:light-dark(#71521b,#ecd29b);--ol-warn-bg:light-dark(#fff7e5,#3a3223);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;font-size:14px;line-height:1.55;color:var(--ol-text);background:var(--ol-bg);border:1px solid var(--ol-line);border-radius:18px;overflow:clip;isolation:isolate;text-align:left}
#overseas-ledger-v2 *{box-sizing:border-box}
#overseas-ledger-v2 button,#overseas-ledger-v2 input,#overseas-ledger-v2 select,#overseas-ledger-v2 textarea{font:inherit;color:inherit}
#overseas-ledger-v2 button{border:1px solid var(--ol-line);border-radius:9px;background:var(--ol-panel);padding:8px 12px;min-height:36px;white-space:nowrap;font-weight:500}
#overseas-ledger-v2 button:hover{background:var(--ol-soft)}
#overseas-ledger-v2 button:disabled{opacity:.55;cursor:not-allowed}
#overseas-ledger-v2 .ol-primary{background:var(--ol-accent);color:var(--ol-on);border-color:transparent}
#overseas-ledger-v2 .ol-primary:hover{filter:brightness(.94);background:var(--ol-accent)}
#overseas-ledger-v2 .ol-quiet{background:transparent;border-color:transparent;color:var(--ol-sub)}
#overseas-ledger-v2 .ol-danger{color:var(--ol-danger)}
#overseas-ledger-v2 .ol-top{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:23px 26px;background:var(--ol-panel);border-bottom:1px solid var(--ol-line)}
#overseas-ledger-v2 .ol-brand{display:flex;gap:12px;align-items:center;min-width:0}
#overseas-ledger-v2 .ol-mark{display:grid;place-items:center;border-radius:12px;background:var(--ol-accent);color:var(--ol-on);width:40px;height:40px;font-size:20px;font-weight:600;flex-shrink:0}
#overseas-ledger-v2 h1{font-size:20px;line-height:1.4;letter-spacing:-.6px;margin:0;font-weight:650}
#overseas-ledger-v2 h2{font-size:17px;line-height:1.5;margin:0;font-weight:600;letter-spacing:-.3px}
#overseas-ledger-v2 h3{font-size:14px;margin:0;font-weight:600}
#overseas-ledger-v2 p{margin:0}
#overseas-ledger-v2 small,#overseas-ledger-v2 .ol-small{font-size:12px;color:var(--ol-sub)}
#overseas-ledger-v2 .ol-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#overseas-ledger-v2 .ol-save{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ol-sub)}
#overseas-ledger-v2 .ol-save::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
#overseas-ledger-v2 .ol-page{padding:20px 26px 26px}
#overseas-ledger-v2 .ol-notice{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-radius:10px;background:var(--ol-tint);padding:11px 14px;margin-bottom:18px}
#overseas-ledger-v2 .ol-notice b{font-weight:600;color:var(--ol-accent)}
#overseas-ledger-v2 .ol-notice span{font-size:12px;color:var(--ol-sub)}
#overseas-ledger-v2 .ol-metrics{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:12px;margin-bottom:20px}
#overseas-ledger-v2 .ol-metric{border-radius:12px;background:var(--ol-panel);border:1px solid var(--ol-line);padding:17px 18px;min-width:0}
#overseas-ledger-v2 .ol-metric:first-child{background:var(--ol-accent);color:var(--ol-on);border-color:transparent}
#overseas-ledger-v2 .ol-metric:first-child .ol-label,#overseas-ledger-v2 .ol-metric:first-child small{color:var(--ol-on);opacity:.8}
#overseas-ledger-v2 .ol-label{font-size:12px;color:var(--ol-sub);display:block;margin-bottom:6px}
#overseas-ledger-v2 .ol-value{font-size:26px;letter-spacing:-.6px;line-height:1.35;font-weight:600;display:block;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
#overseas-ledger-v2 .ol-unit{font-size:13px;letter-spacing:0;font-weight:400;margin-left:4px}
#overseas-ledger-v2 .ol-metric small{display:block;margin-top:8px}
#overseas-ledger-v2 .ol-tabs{display:flex;border-bottom:1px solid var(--ol-line);gap:20px;margin-bottom:20px}
#overseas-ledger-v2 .ol-tabs button{border:none;border-radius:0;background:transparent;padding:10px 0 14px;color:var(--ol-sub);position:relative}
#overseas-ledger-v2 .ol-tabs button[aria-selected=true]{color:var(--ol-text);font-weight:650}
#overseas-ledger-v2 .ol-tabs button[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:2px;background:var(--ol-accent)}
#overseas-ledger-v2 .ol-tabs small{font-size:10px;letter-spacing:.7px;margin-right:6px;opacity:.7}
#overseas-ledger-v2 .ol-sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#overseas-ledger-v2 .ol-sectionhead small{margin-left:6px;font-weight:400}
#overseas-ledger-v2 .ol-stack{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
#overseas-ledger-v2 .ol-item{border:1px solid var(--ol-line);border-radius:12px;background:var(--ol-panel);overflow:clip}
#overseas-ledger-v2 .ol-itembar{display:flex;align-items:center;gap:10px;padding:0 14px 0 0}
#overseas-ledger-v2 .ol-toggle{display:flex;align-items:center;gap:13px;flex:1;min-width:0;text-align:left;padding:15px 17px;border:none;border-radius:0;background:transparent;white-space:normal;transition:background-color .14s ease}
#overseas-ledger-v2 .ol-avatar{width:39px;height:39px;flex:0 0 39px;border-radius:10px;background:var(--ol-soft);display:grid;place-items:center;font-size:11px;letter-spacing:.3px;font-weight:650;color:var(--ol-accent)}
#overseas-ledger-v2 .ol-identity{min-width:80px;flex:1;overflow-wrap:anywhere}
#overseas-ledger-v2 .ol-identity strong{display:block;font-size:15px;font-weight:600}
#overseas-ledger-v2 .ol-identity small{display:block;font-weight:400;overflow-wrap:anywhere}
#overseas-ledger-v2 .ol-itemnums{display:flex;gap:30px;text-align:right}
#overseas-ledger-v2 .ol-itemnums strong{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#overseas-ledger-v2 .ol-chevron{font-size:19px;color:var(--ol-sub);width:16px;text-align:center;flex-shrink:0}
#overseas-ledger-v2 .ol-detail{padding:0 17px 17px;border-top:1px solid var(--ol-line)}
#overseas-ledger-v2 .ol-detailhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 0 10px}
#overseas-ledger-v2 .ol-tablewrap{overflow-x:auto;max-width:100%}
#overseas-ledger-v2 table{border-collapse:collapse;width:100%;font-size:12px;text-align:left;white-space:nowrap}
#overseas-ledger-v2 th{font-weight:500;color:var(--ol-sub);background:var(--ol-soft);padding:9px 11px}
#overseas-ledger-v2 td{padding:10px 11px;border-bottom:1px solid var(--ol-line);font-variant-numeric:tabular-nums}
#overseas-ledger-v2 tbody tr:last-child td{border-bottom:none}
#overseas-ledger-v2 th:first-child{border-radius:7px 0 0 7px}
#overseas-ledger-v2 th:last-child{border-radius:0 7px 7px 0}
#overseas-ledger-v2 .ol-num{text-align:right;font-variant-numeric:tabular-nums}
#overseas-ledger-v2 .ol-rowaction{padding:4px 6px;min-height:28px;font-size:12px;background:transparent;border-color:transparent}
#overseas-ledger-v2 .ol-income{margin-top:25px}
#overseas-ledger-v2 .ol-incomebox{border:1px solid var(--ol-line);background:var(--ol-panel);padding:17px;border-radius:12px}
#overseas-ledger-v2 .ol-incomevalues{display:flex;gap:25px;flex-wrap:wrap;padding-bottom:16px}
#overseas-ledger-v2 .ol-incomevalues strong{font-weight:600;font-size:17px;margin-left:9px;font-variant-numeric:tabular-nums}
#overseas-ledger-v2 .ol-pill{font-size:11px;padding:3px 7px;border-radius:5px;background:var(--ol-soft);color:var(--ol-sub);white-space:nowrap}
#overseas-ledger-v2 .ol-form{padding:16px;background:var(--ol-soft);border-radius:10px;margin:0 0 13px}
#overseas-ledger-v2 .ol-formhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#overseas-ledger-v2 .ol-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#overseas-ledger-v2 label{display:block;font-size:12px;color:var(--ol-sub)}
#overseas-ledger-v2 input,#overseas-ledger-v2 select,#overseas-ledger-v2 textarea{width:100%;padding:9px 10px;min-height:40px;border:1px solid var(--ol-line);border-radius:7px;background:var(--ol-panel);margin-top:5px;font-size:14px;min-width:0;color:var(--ol-text)}
#overseas-ledger-v2 input:disabled,#overseas-ledger-v2 select:disabled{opacity:.7}
#overseas-ledger-v2 .ol-formfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px}
#overseas-ledger-v2 .ol-formhint{font-size:12px;color:var(--ol-sub);max-width:580px}
#overseas-ledger-v2 .ol-error{color:var(--ol-danger);font-size:12px;margin-top:10px}
#overseas-ledger-v2 .ol-empty{padding:24px 16px;text-align:center;color:var(--ol-sub);font-size:13px}
#overseas-ledger-v2 .ol-empty strong{display:block;color:var(--ol-text);font-weight:500;margin-bottom:4px}
#overseas-ledger-v2 .ol-alert{padding:10px 12px;color:var(--ol-warn);background:var(--ol-warn-bg);border-radius:8px;font-size:12px;margin-bottom:12px}
#overseas-ledger-v2 .ol-toast{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ol-soft);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12px}
#overseas-ledger-v2 .ol-confirm{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
#overseas-ledger-v2 .ol-footer{border-top:1px solid var(--ol-line);padding-top:14px;margin-top:22px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
#overseas-ledger-v2 .ol-details{margin-top:12px;color:var(--ol-sub);font-size:12px}
#overseas-ledger-v2 .ol-details summary{font-weight:500;width:fit-content}
#overseas-ledger-v2 .ol-details p{margin-top:7px}
#overseas-ledger-v2 .ol-backup{padding:16px;margin-bottom:16px;border:1px solid var(--ol-line);background:var(--ol-panel);border-radius:12px}
#overseas-ledger-v2 .ol-backup textarea{min-height:125px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
#overseas-ledger-v2 .ol-group-list{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
#overseas-ledger-v2 .ol-grouphead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
#overseas-ledger-v2 .ol-group-name{min-width:0;overflow-wrap:anywhere}
#overseas-ledger-v2 .ol-group-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:1;min-width:200px;padding:6px 8px;margin:-6px 0 -6px -8px;border:0;border-radius:8px;background:transparent;text-align:left;color:inherit}

#overseas-ledger-v2 .ol-group-toggle .ol-group-name{display:block}

#overseas-ledger-v2 .ol-group-name>small strong{color:var(--ol-text);margin-left:6px;font-weight:600;font-variant-numeric:tabular-nums}
#overseas-ledger-v2 .ol-weight{min-width:76px}

#overseas-ledger-v2 .ol-allocation-note{display:block;margin-top:12px}

 const buys=fx.filter(x=>x.direction!=='sell'),sells=fx.filter(x=>x.direction==='sell');

 if(s.client?.dataPath===GITHUB_FALLBACK_PATH)content+=`<p>저장 파일: <code>${GITHUB_FALLBACK_PATH}</code>. 저장소 최상위의 기록 파일을 사용합니다.</p>`;
 if(phase==='new')content+=`<p>저장소에 아직 기록 파일이 없습니다. 현재 기록을 처음 저장하면 이후 변경은 자동 저장됩니다.</p><div class="ol-git-summary">${esc(ledgerSummary(data))}</div>${button('현재 기록 GitHub에 처음 저장','git-initial','','ol-primary',disabled)}`;

  if(syncConfirm==='repair')content+=`<div class="ol-alert" style="margin-top:12px">기존 파일을 내려받고 현재 기기 기록으로 교체합니다. ${data.stocks.length===0&&data.trades.length===0&&data.exchanges.length===0&&data.incomes.length===0?'현재 기기에는 거래 기록이 없어 빈 장부가 저장됩니다.':'저장할 기록을 위 요약에서 확인해 주세요.'}<div class="ol-actions">${button('원본 백업 후 복구 확인','git-confirm','repair','ol-primary',disabled)}${button('취소','git-cancel-choice','','',disabled)}</div></div>`;
 }
 if(phase==='conflict'||phase==='waiting'){
  content+=`<div class="ol-git-compare"><div><strong>이 기기 기록</strong><p>${esc(ledgerSummary(data))}</p>${button('이 기기 백업 받기','download-backup','','ol-rowaction')}</div><div><strong>GitHub 기록</strong><p>${s.remote?esc(ledgerSummary(s.remote.data)):'기록 파일 없음'}</p>${s.remote?button('GitHub 백업 받기','download-remote','','ol-rowaction'):''}</div></div>`;
  if(syncConfirm){content+=`<div class="ol-alert">${syncConfirm==='local'?'이 기기 기록으로 GitHub 기록을 교체할까요?':'GitHub 기록으로 이 기기 기록을 교체할까요?'} 교체 전 기록은 복구용으로 보관합니다.<div class="ol-actions">${button('교체 확인','git-confirm',syncConfirm,'ol-primary',disabled)}${button('취소','git-cancel-choice','','',disabled)}</div></div>`;}
  else content+=`<div class="ol-actions">${s.remote?button('GitHub 기록 사용','git-select','remote','',disabled):''}${button('이 기기 기록 사용','git-select','local','',disabled)}</div>`;
 }
 if(phase==='error')content+=`<small>연결이 복구될 때까지 기기의 기록을 보관합니다. 연결 정보가 맞으면 ‘지금 동기화’를 눌러 주세요.</small>`;

 return `<section class="ol-gitsetup" aria-label="GitHub 데이터 저장"><div class="ol-sectionhead"><h2>GitHub 데이터 저장</h2>${button('닫기','github-toggle','','ol-quiet')}</div><p class="ol-small">투자 기록은 비공개 저장소의 <code data-git-path>${gitSync?.client?.dataPath||GITHUB_DATA_PATH}</code>에 저장합니다. 다른 PC에서도 같은 저장소를 연결하면 기록을 불러옵니다.</p><form data-github-form autocomplete="off"><div class="ol-fields">${field('GitHub 아이디 / 조직','gitOwner',c.owner,'text','required maxlength="39" autocomplete="off" placeholder="GitHub 아이디"')}${field('데이터 저장소 이름 · 비공개','gitRepo',c.repo,'text','required maxlength="100" autocomplete="off" placeholder="overseas-ledger-data"')}${field('브랜치','gitBranch',c.branch,'text','required maxlength="200" autocomplete="off" placeholder="main"')}<label class="ol-git-token">Fine-grained 개인 액세스 토큰<input name="gitToken" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="github_pat_…" maxlength="512" aria-label="GitHub 액세스 토큰"></label></div><small>토큰은 이 탭의 세션에만 보관됩니다. HTML 파일·장부·백업·Git 저장소에는 넣지 않습니다.</small><div class="ol-formfoot"><div class="ol-actions">${button('연결하고 기록 확인','git-connect','','ol-primary',gitSync?.busy?'disabled':'')}${button('지금 동기화','git-refresh','','',!gitSync?.client||gitSync.busy?'disabled':'')}${button('연결 해제','git-disconnect','','ol-quiet',gitSync?.busy?'disabled':'')}</div></div><div data-git-form-error class="ol-error" role="alert"></div></form><div data-git-details>${syncDetails()}</div><details class="ol-git-help"><summary>처음 연결하는 방법</summary><ol><li>GitHub에서 데이터 전용 저장소를 <b>Private</b>로 만들고 <b>Add a README file</b>을 선택합니다. 예: <code>overseas-ledger-data</code>.</li><li>GitHub의 <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens</b>에서 토큰을 만듭니다. <b>Only select repositories</b>로 데이터 저장소만 선택하고, <b>Repository permissions → Contents → Read and write</b>를 지정합니다.</li><li>위에 저장소 정보와 토큰을 입력하고 연결합니다. 기록 파일과 폴더는 자동으로 생성됩니다. 최초에는 ‘현재 기록 GitHub에 처음 저장’을 누릅니다.</li><li>다른 PC에서는 같은 HTML 주소를 열고 동일한 데이터 저장소를 연결합니다. 토큰이 만료되면 새 토큰을 입력합니다.</li></ol><p><a href="https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens" target="_blank" rel="noopener noreferrer">GitHub 공식 토큰 안내</a></p></details></section>`;
}
function paintSync(){
 root.querySelectorAll('[data-git-path]').forEach(el=>el.textContent=gitSync?.client?.dataPath||GITHUB_DATA_PATH);
 root.querySelectorAll('[data-github-form] input').forEach(el=>el.disabled=!!gitSync?.busy);
 root.querySelectorAll('[data-git-status]').forEach(el=>el.textContent=saveStatus());
 const detail=root.querySelector('[data-git-details]');if(detail)detail.innerHTML=syncDetails();
 root.querySelectorAll('[data-action="git-connect"],[data-action="git-disconnect"]').forEach(b=>b.disabled=!!gitSync?.busy);
 root.querySelectorAll('[data-action="git-refresh"]').forEach(b=>b.disabled=!gitSync?.client||gitSync.busy);
 const alert=root.querySelector('[data-git-alert]');if(alert){const show=gitSync&&['error','conflict','waiting','new','invalid'].includes(gitSync.phase);alert.hidden=!show;if(show)alert.innerHTML=`<span>${esc(gitSync.message||'GitHub 연결을 확인했습니다. 최초 저장을 완료해 주세요.')}</span>${button('확인','github-open','','ol-rowaction')}`;else alert.textContent='';}
}
function rememberRecovery(value,label){
 if(emptyLedger(value))return;recovery={savedAt:new Date().toISOString(),label,data:validate(value)};
 try{localStorage.setItem(RECOVERY_KEY,JSON.stringify(recovery));}catch{storage=false;}
}
function downloadLedger(value,tag='backup'){
 const file=new Blob([JSON.stringify(validate(value),null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(file),a=document.createElement('a');
 a.href=url;a.download=`overseas-ledger-${tag}-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function rememberRawRecovery(value){rawRecovery={rawBase64:value.rawBase64,path:value.path,sha:value.sha,savedAt:new Date().toISOString()};try{localStorage.setItem(RAW_RECOVERY_KEY,JSON.stringify(rawRecovery));}catch{storage=false;}}
function downloadRawFile(value){
 const raw=atob(value.rawBase64.replace(/\s/g,'')),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'})),a=document.createElement('a');
 a.href=url;a.download=`github-original-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function readCachedBase(target){try{const c=JSON.parse(localStorage.getItem(BASE_KEY)||'null');return c?.target===target?c:null;}catch{return null;}}
function connectFromForm(){
 const f=root.querySelector('[data-github-form]');if(!f||!f.reportValidity())return;
 const el=f.elements;syncDraft={owner:el.gitOwner.value.trim(),repo:el.gitRepo.value.trim(),branch:el.gitBranch.value.trim()};syncTokenDraft=el.gitToken.value.trim()||syncTokenDraft;
 const error=f.querySelector('[data-git-form-error]');error.textContent='';syncConfirm='';
 gitSync.connect(syncDraft,syncTokenDraft).catch(e=>{error.textContent=e.message;paintSync();});
}
function initializeGitSync(){
 gitSync=new GitLedgerSync({getData:()=>data,canApply:()=>!editor&&!backup&&!dragState,
  applyData:value=>{rememberRecovery(data,'이 기기 교체 전');data=validate(value);undo=null;expanded=new Set();incomeExpanded=new Set();persist(false);toast='GitHub의 최신 기록을 불러왔습니다.';render();},
  recover:rememberRecovery,recoverRaw:rememberRawRecovery,loadBase:readCachedBase,
  saveBase:value=>{try{localStorage.setItem(BASE_KEY,JSON.stringify(value));}catch{storage=false;}},
  connected:(config,token)=>{syncDraft=config;try{localStorage.setItem(CONFIG_KEY,JSON.stringify(config));}catch{}try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({target:gitTarget(config),token}));}catch{}},
  changed:paintSync
 });
 render();
 try{const session=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null'),config=gitConfig(syncDraft);if(session?.target===gitTarget(config)&&session.token){syncTokenDraft=session.token;gitSync.connect(config,session.token).catch(e=>gitSync.fail(e));}}catch{}
 window.addEventListener('online',()=>{if(gitSync.client&&!editor)gitSync.refresh();});
 window.addEventListener('focus',()=>{if(gitSync.client&&!editor&&gitSync.phase==='synced')gitSync.refresh();});
 window.addEventListener('beforeunload',e=>{if(gitSync.client&&(gitSync.dirty()||gitSync.busy)){e.preventDefault();e.returnValue='';}});
}

function commit(next,message){next=validate(next);undo={data:JSON.parse(JSON.stringify(data))};data=next;editor=null;deleteConfirm='';toast=message;persist();render();}
function openEditor(kind,id='',parent='',side='buy'){editor={kind,id,parent,side};deleteConfirm='';if(parent&&['trade','exchange'].includes(kind))expanded.add(parent);render();const input=root.querySelector('.ol-form input:not([disabled])');if(input)input.focus();}
function deleteRecord(kind,id){
 const collections={group:'groups',stock:'stocks',account:'accounts',trade:'trades',exchange:'exchanges',income:'incomes',incomeitem:'incomeItems'};
 if(kind==='stock'&&(data.trades.some(x=>x.stockId===id)||data.incomes.some(x=>x.stockId===id))){toast='매수·매도·입금 기록이 연결된 종목입니다. 연결된 기록을 먼저 정리해 주세요.';deleteConfirm='';render();return;}
 if(kind==='account'&&(data.trades.some(x=>x.accountId===id)||data.exchanges.some(x=>x.accountId===id)||data.incomes.some(x=>x.accountId===id))){toast='기록이 연결된 통화 계정입니다. 연결된 기록을 먼저 정리해 주세요.';deleteConfirm='';render();return;}
 if(kind==='incomeitem'&&data.incomes.some(x=>x.itemId===id)){toast='수령 기록이 있는 항목입니다. 숨기기를 사용하면 기록과 합계를 보존하면서 목록에서 제외할 수 있습니다.';deleteConfirm='';render();return;}
 try{const next=JSON.parse(JSON.stringify(data));if(kind==='group')next.stocks.forEach(s=>{if(s.groupId===id)s.groupId='';});if(kind==='stock')next.incomeItems.forEach(i=>{if(i.stockId===id)i.stockId='';});next[collections[kind]]=next[collections[kind]].filter(x=>x.id!==id);commit(next,kind==='group'?'그룹을 삭제하고 종목을 미분류로 옮겼습니다.':'기록을 삭제했습니다. 되돌릴 수 있어요.');}catch(e){toast=e.message;deleteConfirm='';render();}
}
root.addEventListener('click',event=>{
 const target=event.target.closest('button[data-action]');if(!target||!root.contains(target))return;const action=target.dataset.action,id=target.dataset.id;
 if(action==='github-toggle'){syncOpen=!syncOpen;syncConfirm='';render();}
 else if(action==='github-open'){syncOpen=true;syncConfirm='';render();root.querySelector('.ol-gitsetup')?.scrollIntoView({block:'start'});}
 else if(action==='git-connect')connectFromForm();
 else if(action==='git-refresh'){syncConfirm='';gitSync.refresh();}
 else if(action==='git-disconnect'){gitSync.disconnect();syncTokenDraft='';syncConfirm='';try{sessionStorage.removeItem(SESSION_KEY);}catch{}render();}
 else if(action==='git-initial'){syncConfirm='';gitSync.choose('local');}
 else if(action==='git-select'){syncConfirm=id;paintSync();}
 else if(action==='git-cancel-choice'){syncConfirm='';paintSync();}
 else if(action==='git-confirm'){syncConfirm='';if(id==='repair'){if(gitSync.remote?.invalid){downloadRawFile(gitSync.remote);gitSync.choose('local');}}else gitSync.choose(id);}
 else if(action==='download-backup')downloadLedger(data);
 else if(action==='download-remote'&&gitSync.remote&&!gitSync.remote.invalid)downloadLedger(gitSync.remote.data,'github');
 else if(action==='download-raw'&&gitSync.remote?.invalid)downloadRawFile(gitSync.remote);
 else if(action==='download-raw-recovery'&&rawRecovery)downloadRawFile(rawRecovery);
 else if(action==='download-recovery'&&recovery)downloadLedger(recovery.data,'recovery');
 else if(action==='save-form'){const f=target.closest('form');if(f.reportValidity())saveForm(f);}
 else if(action==='tab'){tab=id;editor=null;deleteConfirm='';render();root.querySelector('#ol-tab-'+id).focus({preventScroll:true});}
 else if(action==='toggle'){expanded.has(id)?expanded.delete(id):expanded.add(id);render();root.querySelector('[data-action="toggle"][data-id="'+id+'"]').focus({preventScroll:true});}
 else if(action==='toggle-group'){expandedGroups.has(id)?expandedGroups.delete(id):expandedGroups.add(id);render();root.querySelector('[data-action="toggle-group"][data-id="'+id+'"]').focus({preventScroll:true});}
 else if(action==='new-group')openEditor('group');
 else if(action==='new-stock')openEditor('stock','',id);
 else if(action==='new-account')openEditor('account');
 else if(action==='new-trade')openEditor('trade','',id,'buy');
 else if(action==='new-sell')openEditor('trade','',id,'sell');
 else if(action==='new-exchange')openEditor('exchange','',id,'buy');
 else if(action==='new-fx-sell')openEditor('exchange','',id,'sell');
 else if(action==='new-income')openEditor('income','',id);
 else if(action==='new-incomeitem')openEditor('incomeitem');
 else if(action==='income-from-stocks'){
  const next=JSON.parse(JSON.stringify(data)),missing=next.stocks.filter(s=>!next.incomeItems.some(i=>i.stockId===s.id));missing.forEach(s=>next.incomeItems.push({id:uid(),label:s.ticker,kind:'dividend',code:s.code,stockId:s.id,hidden:false}));
  if(missing.length)commit(next,missing.length+'개 배당금 항목을 추가했습니다.');else{toast='보유 종목의 항목이 이미 있습니다. 숨긴 항목은 아래에서 다시 표시할 수 있습니다.';render();}
 }
 else if(action==='hide-incomeitem'||action==='show-incomeitem'){const next=JSON.parse(JSON.stringify(data));next.incomeItems.find(i=>i.id===id).hidden=action==='hide-incomeitem';commit(next,action==='hide-incomeitem'?'항목을 숨겼습니다. 수령 기록과 합계는 유지됩니다.':'항목을 다시 표시했습니다.');}
 else if(action==='toggle-income'){incomeExpanded.has(id)?incomeExpanded.delete(id):incomeExpanded.add(id);render();root.querySelector('[data-action="toggle-income"][data-id="'+id+'"]').focus({preventScroll:true});}
 else if(action==='cancel'){editor=null;render();}
 else if(action==='edit'){const [kind,key]=id.split(':');const parent=kind==='trade'?data.trades.find(x=>x.id===key).stockId:kind==='exchange'?data.exchanges.find(x=>x.id===key).accountId:'';openEditor(kind,key,parent);}
 else if(action==='ask-delete'){deleteConfirm=id;render();}
 else if(action==='cancel-delete'){deleteConfirm='';render();}
 else if(action==='delete'){const [kind,key]=id.split(':');deleteRecord(kind,key);}
 else if(action==='dismiss'){toast='';undo=null;render();}
 else if(action==='undo'){if(undo){data=undo.data;undo=null;toast='직전 변경을 되돌렸습니다.';editor=null;persist();render();}}
 else if(action==='backup'){backup=!backup;importReady=null;render();}
 else if(action==='select-backup'){const area=root.querySelector('[data-backup]');area.focus();area.select();}
 else if(action==='check-import'){
  const status=root.querySelector('[data-importstatus]');try{const raw=root.querySelector('[data-backup]').value;if(raw.length>3000000)throw Error('백업이 너무 큽니다.');const parsed=JSON.parse(raw);importReady=validate(parsed.format==='overseas-ledger'?parsed.data:parsed);status.innerHTML=`<div class="ol-alert" style="margin-top:12px">통화 ${importReady.accounts.length}개 · 종목 ${importReady.stocks.length}개 · 거래 ${importReady.trades.length+importReady.exchanges.length+importReady.incomes.length}건. 현재 내 기록을 이 백업으로 바꿀까요? ${button('내 기록으로 불러오기','apply-import','','ol-primary')}</div>`;}catch(e){importReady=null;status.innerHTML='<div class="ol-error">'+esc(e.message)+'</div>';}
 }
 else if(action==='apply-import'&&importReady){rememberRecovery(data,'백업 불러오기 전');undo={data:JSON.parse(JSON.stringify(data))};data=importReady;importReady=null;toast='백업을 내 기록으로 불러왔습니다.';backup=false;editor=null;expanded=new Set();incomeYear='';incomeMonth='';incomeExpanded=new Set();persist();render();}
});
root.addEventListener('change',e=>{
 if(e.target.matches('[data-move-stock]')){const id=e.target.dataset.moveStock,next=JSON.parse(JSON.stringify(data));next.stocks.find(s=>s.id===id).groupId=e.target.value;commit(next,'소속 그룹과 매수원금 비중을 갱신했습니다.');root.querySelector('[data-move-stock="'+id+'"]').focus({preventScroll:true});}
 else if(e.target.matches('[data-income-filter]')){const type=e.target.dataset.incomeFilter;if(type==='year'){incomeYear=e.target.value;if(!incomeYear)incomeMonth='';}else incomeMonth=e.target.value;editor=null;render();root.querySelector('[data-income-filter="'+type+'"]').focus();}
});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('[data-github-form]')){e.preventDefault();connectFromForm();return;}if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['main','income','sub'];tab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[2]:tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3];editor=null;render();root.querySelector('#ol-tab-'+tab).focus({preventScroll:true});}else if(e.key==='Enter'&&e.target.matches('form input')){e.preventDefault();const f=e.target.closest('form');if(f.reportValidity())saveForm(f);}});
root.addEventListener('input',e=>{
 if(e.target.closest('[data-github-form]')){const el=e.target.closest('form').elements;syncDraft={owner:el.gitOwner.value,repo:el.gitRepo.value,branch:el.gitBranch.value};syncTokenDraft=el.gitToken.value;return;}
 if(e.target.matches('[data-backup]')){importReady=null;root.querySelector('[data-importstatus]').textContent='';return;}
 const f=e.target.closest('form');if(!f)return;const el=f.elements,kind=f.dataset.kind;f.querySelector('.ol-error').textContent='';
 if(kind==='trade'){
  const sell=el.side.value==='sell',a=account(el.accountId.value);el.amount.parentElement.firstChild.textContent=`${sell?'매도금액 · 실수령':'매수금액 · 실결제'} (${a.code})`;el.qty.parentElement.firstChild.textContent=sell?'매도주수':'매수주수';
  if(e.target.name==='amount')f.dataset.manualAmount='1';if(['qty','price'].includes(e.target.name)&&!f.dataset.manualAmount&&!f.dataset.id&&el.qty.value&&el.price.value)el.amount.value=round(Number(el.qty.value)*Number(el.price.value));
  if(e.target.name==='accountId'){const avg=accountTotals(data,a.id).average;el.rate.value=avg>0?round(avg,4):'';el.rate.parentElement.firstChild.textContent=`거래 당시 환율 (원 / ${a.unit} ${a.code})`;}
  const existing=data.trades.find(x=>x.id===f.dataset.id),previous=existing&&existing.accountId===a.id?(existing.side==='sell'?existing.amount:-existing.amount):0,after=accountTotals(data,a.id).balance-previous+(sell?1:-1)*Number(el.amount.value||0);
  f.querySelector('[data-livehint]').textContent=`저장 후 ${a.label} 잔액 ${money(after,a.code)} · ${sell?'세금·수수료를 뺀 실제 입금액을 입력하세요.':'수수료를 포함한 실제 결제액을 입력하세요.'}${after<0?' 누락된 기록을 확인해 주세요.':''}`;
 }
 if(kind==='exchange'){
  const a=account(f.dataset.parent),sell=el.direction.value==='sell';el.krw.parentElement.firstChild.textContent=sell?'받은 원화 · 수수료 차감 후 (원)':'낸 원화 · 수수료 포함 (원)';el.amount.parentElement.firstChild.textContent=`${sell?'사용한':'받은'} 외화 (${a.code})`;
  if(e.target.name==='rate')f.dataset.manualRate='1';if(['direction','krw','amount','fee'].includes(e.target.name)&&!f.dataset.manualRate&&!f.dataset.id&&Number(el.amount.value)>0)el.rate.value=round((Number(el.krw.value)+(sell?1:-1)*Number(el.fee.value||0))/Number(el.amount.value)*a.unit,6);
 }
 if(kind==='account'&&e.target.name==='code')el.unit.value=el.code.value.toUpperCase()==='JPY'?'100':'1';
 if(kind==='incomeitem'&&e.target.name==='stockId'&&el.stockId.value){const s=stock(el.stockId.value);el.code.value=s.code;if(!el.label.value)el.label.value=s.ticker;}
 if(kind==='income'){
  const item=data.incomeItems.find(i=>i.id===el.itemId.value);if(e.target.name==='itemId'){el.accountId.innerHTML=options(data.accounts.filter(a=>a.code===item.code),defaultIncomeAccount(data,item.code)?.id,a=>a.label+' · '+a.code);el.kind.value=item.kind;}
  el.gross.parentElement.firstChild.textContent=`세전금액 (${item.code})`;el.tax.parentElement.firstChild.textContent=`세금 (${item.code})`;el.perShare.parentElement.firstChild.textContent=`1주당 배당금 (${item.code}) · 선택`;el.net.value=money(round(Number(el.gross.value||0)-Number(el.tax.value||0)),item.code);
 }
});
function saveForm(f){
 const el=f.elements,kind=f.dataset.kind,id=f.dataset.id||uid(),parent=f.dataset.parent,v=name=>el[name]?.value.trim()||'',n=name=>Number(v(name)),next=JSON.parse(JSON.stringify(data));let record,collection;
 try{
  if(kind==='group'){record={id,label:v('label'),colorIndex:data.groups.find(g=>g.id===id)?.colorIndex};collection='groups';if(record.label==='미분류'||data.groups.some(g=>g.id!==id&&g.label.toLowerCase()===record.label.toLowerCase()))throw Error('그룹 이름이 이미 있습니다. 다른 이름을 입력해 주세요.');}
  if(kind==='stock'){record={id,ticker:v('ticker').toUpperCase(),name:v('name'),code:v('code').toUpperCase(),groupId:v('groupId')};collection='stocks';if(data.stocks.some(s=>s.id!==id&&s.ticker===record.ticker&&s.code===record.code))throw Error('같은 종목이 이미 있습니다. 기존 종목에 거래 기록을 추가해 주세요.');next.incomeItems.forEach(i=>{if(i.stockId===id)i.code=record.code;});if(!f.dataset.id&&v('createIncome')==='yes')next.incomeItems.push({id:uid(),label:record.ticker,kind:'dividend',code:record.code,stockId:id,hidden:false});}
  if(kind==='account'){record={id,label:v('label'),code:v('code').toUpperCase(),unit:n('unit')};collection='accounts';if(data.accounts.some(a=>a.id!==id&&a.label===record.label))throw Error('계정 이름이 이미 있습니다. 달러1·달러2처럼 구분해 주세요.');}
  if(kind==='trade'){record={id,stockId:parent,side:v('side'),accountId:v('accountId'),date:v('date'),amount:n('amount'),qty:n('qty'),price:n('price'),rate:n('rate')};collection='trades';}
  if(kind==='exchange'){record={id,accountId:parent,direction:v('direction'),date:v('date'),krw:n('krw'),amount:n('amount'),rate:n('rate'),fee:n('fee')};collection='exchanges';}
  if(kind==='incomeitem'){record={id,label:v('label'),kind:v('kind'),code:v('code').toUpperCase(),stockId:v('stockId'),hidden:data.incomeItems.find(i=>i.id===id)?.hidden||false};collection='incomeItems';}
  if(kind==='income'){record={id,kind:v('kind'),itemId:v('itemId'),stockId:next.incomeItems.find(i=>i.id===v('itemId'))?.stockId||'',accountId:v('accountId'),date:v('date'),gross:n('gross'),tax:n('tax'),qty:v('qty')===''?null:n('qty'),perShare:v('perShare')===''?null:n('perShare'),memo:v('memo')};collection='incomes';if(record.tax>record.gross)throw Error('세금은 세전금액을 초과할 수 없습니다.');}
  if(!record)return;const idx=next[collection].findIndex(x=>x.id===id);if(idx>=0)next[collection][idx]=record;else next[collection].push(record);
  if(kind==='stock'||kind==='account')expanded.add(id);if(kind==='income')incomeExpanded.add(record.itemId);if(kind==='incomeitem')incomeExpanded.add(id);const outside=kind==='income'&&!periodIncomes({incomes:[record]},incomeYear,incomeMonth).length;commit(next,outside?'기록을 저장했습니다. 현재 선택한 수령 기간 밖의 내역입니다.':'기록을 저장했습니다.');
 }catch(err){f.querySelector('.ol-error').textContent=err.message;}
}
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.matches('[data-github-form]'))connectFromForm();else if(e.target.matches('form')&&e.target.reportValidity())saveForm(e.target);});
// Pointer dragging also works with touch. Keyboard: Space, Home/End or arrows, Enter.
let dragState=null,dragFrame=0;
function dragNodes(kind,id){
 const nodes=[...root.querySelectorAll('[data-sort-kind]')].filter(n=>n.dataset.sortKind===kind);
 if(kind!=='stock')return nodes;
 const group=stock(id)?.groupId;return nodes.filter(n=>stock(n.dataset.sortId)?.groupId===group);
}
function dragMessage(message){const live=root.querySelector('[data-drag-live]');if(live)live.textContent=message;}
function markDrop(node,placement){
 root.querySelectorAll('.ol-drop-before,.ol-drop-after').forEach(n=>n.classList.remove('ol-drop-before','ol-drop-after'));
 if(!dragState)return;dragState.target=node;dragState.placement=placement;
 if(node&&node!==dragState.source)node.classList.add('ol-drop-'+placement);
}
function beginDrag(handle,mode,event){
 if(editor||handle.disabled||dragState)return false;
 const kind=handle.dataset.dragKind,id=handle.dataset.id,nodes=dragNodes(kind,id),source=nodes.find(n=>n.dataset.sortId===id);
 if(!source||nodes.length<2)return false;
 dragState={handle,kind,id,nodes,source,mode,active:mode==='keyboard',target:null,placement:'before',x:event?.clientX||0,y:event?.clientY||0,startX:event?.clientX||0,startY:event?.clientY||0,pointerId:event?.pointerId,label:handle.dataset.dragLabel};
 handle.setAttribute('aria-pressed','true');
 if(mode==='keyboard'){source.classList.add('ol-drag-source');dragMessage(dragState.label+' 이동 선택. Home은 맨 위, End는 맨 아래, 방향키로 위치 선택 후 Enter. Escape로 취소.');}
 return true;
}
function pointerDropTarget(){
 const d=dragState;if(!d?.active)return;
 const bounds=root.getBoundingClientRect();if(d.x<bounds.left-30||d.x>bounds.right+30){markDrop(null,'before');return;}
 let nearest=null,distance=Infinity,placement='before';
 for(const node of d.nodes){const r=node.getBoundingClientRect(),mid=(r.top+r.bottom)/2,dist=Math.abs(d.y-mid);if(dist<distance){nearest=node;distance=dist;placement=d.y<mid?'before':'after';}}
 markDrop(nearest,placement);
}
function dragScroll(){
 const d=dragState;if(!d||d.mode!=='pointer'||!d.active)return;
 const edge=70,height=window.innerHeight;
 const speed=d.y<edge?-Math.ceil((edge-d.y)/4):d.y>height-edge?Math.ceil((d.y-height+edge)/4):0;
 if(speed){window.scrollBy(0,Math.max(-22,Math.min(22,speed)));pointerDropTarget();}
 dragFrame=requestAnimationFrame(dragScroll);
}
function clearDrag(){
 const d=dragState;if(!d)return null;dragState=null;cancelAnimationFrame(dragFrame);
 d.source.classList.remove('ol-drag-source');d.handle.setAttribute('aria-pressed','false');
 root.classList.remove('ol-is-dragging');root.querySelectorAll('.ol-drop-before,.ol-drop-after,.ol-drag-ghost').forEach(n=>n.classList.contains('ol-drag-ghost')?n.remove():n.classList.remove('ol-drop-before','ol-drop-after'));
 if(d.pointerId!==undefined&&d.handle.hasPointerCapture?.(d.pointerId))d.handle.releasePointerCapture(d.pointerId);
 return d;
}
function endDrag(save){
 const d=clearDrag();if(!d)return;
 const next=save&&d.active&&d.target?reorderLedgerItem(data,d.kind,d.id,d.target.dataset.sortId,d.placement):null;
 if(next)commit(next,'순서를 저장했습니다.');else dragMessage('이동을 취소했습니다.');
 const handle=[...root.querySelectorAll('[data-drag-kind]')].find(h=>h.dataset.dragKind===d.kind&&h.dataset.id===d.id);handle?.focus({preventScroll:true});
}
root.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-drag-kind]');if(!handle||e.button!==0||e.isPrimary===false)return;
 if(beginDrag(handle,'pointer',e)){e.preventDefault();handle.focus({preventScroll:true});handle.setPointerCapture(e.pointerId);}
});
root.addEventListener('pointermove',e=>{
 const d=dragState;if(!d||d.mode!=='pointer'||e.pointerId!==d.pointerId)return;
 d.x=e.clientX;d.y=e.clientY;if(!d.active&&Math.hypot(d.x-d.startX,d.y-d.startY)<6)return;e.preventDefault();
 if(!d.active){d.active=true;d.source.classList.add('ol-drag-source');root.classList.add('ol-is-dragging');const ghost=document.createElement('div');ghost.className='ol-drag-ghost';ghost.textContent=d.label;root.appendChild(ghost);d.ghost=ghost;dragFrame=requestAnimationFrame(dragScroll);}
 d.ghost.style.left=Math.min(d.x+14,window.innerWidth-d.ghost.offsetWidth-8)+'px';d.ghost.style.top=Math.max(8,Math.min(d.y+15,window.innerHeight-50))+'px';pointerDropTarget();
});
root.addEventListener('pointerup',e=>{if(dragState?.mode==='pointer'&&e.pointerId===dragState.pointerId)endDrag(true);});
root.addEventListener('pointercancel',()=>endDrag(false));
root.addEventListener('lostpointercapture',()=>{if(dragState?.mode==='pointer')endDrag(false);});
root.addEventListener('keydown',e=>{
 const handle=e.target.closest('[data-drag-kind]');if(e.key==='Escape'&&dragState){e.preventDefault();endDrag(false);return;}
 if(!handle)return;
 if(!dragState&&[' ','Enter'].includes(e.key)){e.preventDefault();beginDrag(handle,'keyboard');return;}
 const d=dragState;if(!d||d.mode!=='keyboard')return;
 if([' ','Enter'].includes(e.key)){e.preventDefault();endDrag(true);return;}
 if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();
 const current=d.nodes.indexOf(d.target||d.source);let index=current;
 if(e.key==='Home')index=0;else if(e.key==='End')index=d.nodes.length-1;else index=Math.max(0,Math.min(d.nodes.length-1,current+(e.key==='ArrowUp'?-1:1)));
 const place=(e.key==='End'||e.key==='ArrowDown')?'after':'before';markDrop(d.nodes[index],place);d.nodes[index].scrollIntoView({block:'nearest'});dragMessage((index+1)+'번째 위치. Enter를 누르면 저장합니다.');
});
window.addEventListener('blur',()=>{if(dragState)endDrag(false);});

initializeGitSync();

})();
